name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Workspaces with real test suites. packages/cli/llm/rag/shared and
        # apps/desktop run `typecheck:test` (tsc) + node --test on TS sources;
        # packages/core runs plain node --test on JS (no TS toolchain by design).
        workspace:
          - packages/cli
          - packages/llm
          - packages/rag
          - packages/shared
          - apps/desktop
          - packages/core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cross-workspace type declarations (@pmk/shared, @pmk/rag, @pmk/cli) come
      # from each package's built dist/. A fresh `npm ci` has no dist, so tsc in
      # dependent workspaces cannot resolve them. Build the library packages in
      # dependency order before testing. (@pmk/core is plain JS — no build.)
      - name: Build library packages
        run: |
          npm run build --workspace=@pmk/shared
          npm run build --workspace=@pmk/rag
          npm run build --workspace=@pmk/llm
          npm run build --workspace=@pmk/cli

      - name: Test (typecheck + unit)
        run: npm test --workspace=${{ matrix.workspace }}

      # A test that exercises production objects without isolating HOME writes
      # into the operator's real ~/.pmk store. socket-watchdog-alert.test.ts did
      # this for two months: it constructs a PresenceBroadcaster and calls
      # watchdogTerminate, which appends the daemon's SELF-TERMINATION record.
      # By 2026-08-03 the live audit log held 1,056 fabricated terminations
      # against one genuine incident — the real event was unfindable, and
      # discovering that cost a full investigation.
      #
      # The suite must leave $HOME untouched. Runs after the tests so it sees
      # whatever they created; the runner's HOME is otherwise pristine.
      - name: Assert tests did not write to the real ~/.pmk
        run: |
          if [ -e "$HOME/.pmk" ]; then
            echo "::error::the test suite wrote to \$HOME/.pmk — a test is missing HOME isolation"
            echo "files created:"
            find "$HOME/.pmk" -type f | head -50
            echo
            echo "Fix: use test/helpers/isolated-home.ts (useIsolatedHome()), or inject the"
            echo "write path instead of letting it default to the real store."
            exit 1
          fi
          echo "ok — \$HOME/.pmk absent; the suite touched no production state"

  docs:
    name: docs quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build docs
        run: |
          npm run typecheck --workspace=@pmk/docs
          npm run build --workspace=@pmk/docs

  desktop-build:
    name: desktop production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build desktop runtime dependencies
        run: |
          npm run build --workspace=@pmk/shared
          npm run build --workspace=@pmk/llm

      - name: Typecheck and build desktop
        run: |
          npm run typecheck --workspace=@pmk/desktop
          npm run build --workspace=@pmk/desktop
