name: Traceability check

on:
  pull_request:
    paths:
      - 'docs/prds/**/*.md'
      - 'docs/specs/**/*.md'
      - 'docs/plans/**/*.md'
      - '.claude/plans/**/*.md'
      - 'scripts/traceability.js'
      - 'package.json'
      - 'package-lock.json'

jobs:
  check-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect changed markdown files
        id: files
        run: |
          changed=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}"...HEAD \
            -- 'docs/prds/**/*.md' 'docs/specs/**/*.md' 'docs/plans/**/*.md' '.claude/plans/**/*.md' \
            | tr '\n' ' ')
          echo "files=$changed" >> "$GITHUB_OUTPUT"
          echo "Changed files: $changed"

      - name: Run front-matter check on changed files
        if: steps.files.outputs.files != ''
        run: node scripts/traceability.js check ${{ steps.files.outputs.files }}

      - name: Regenerate traceability matrix and verify committed copy is up to date
        run: |
          node scripts/traceability.js matrix
          if [ -f docs/traceability-matrix.md ]; then
            if ! git diff --exit-code docs/traceability-matrix.md; then
              echo "::error::docs/traceability-matrix.md is stale. Run 'npm run traceability:matrix' locally and commit the result."
              exit 1
            fi
          fi
