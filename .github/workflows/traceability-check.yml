name: Traceability check

on:
  pull_request:
    paths:
      - 'apps/docs/docs/prds/**/*.md'
      - 'apps/docs/docs/specs/**/*.md'
      - 'apps/docs/docs/plans/**/*.md'
      - 'apps/docs/docs/requirements/**/*.md'
      - '.claude/plans/**/*.md'
      - 'packages/core/src/traceability.js'
      - 'package.json'
      - 'package-lock.json'

jobs:
  check-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect changed markdown files (relative to apps/docs)
        id: files
        run: |
          changed=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}"...HEAD \
            -- 'apps/docs/docs/prds/**/*.md' 'apps/docs/docs/specs/**/*.md' 'apps/docs/docs/plans/**/*.md' 'apps/docs/docs/requirements/**/*.md' '.claude/plans/**/*.md' \
            | sed 's|^apps/docs/||g' \
            | tr '\n' ' ')
          echo "files=$changed" >> "$GITHUB_OUTPUT"
          echo "Changed files (relative to apps/docs): $changed"

      - name: Run front-matter check on changed files
        if: steps.files.outputs.files != ''
        run: node packages/core/src/traceability.js check --cwd=apps/docs ${{ steps.files.outputs.files }}

      - name: Regenerate traceability matrix and verify committed copy is up to date
        run: |
          node packages/core/src/traceability.js matrix --cwd=apps/docs
          if [ -f apps/docs/docs/traceability-matrix.md ]; then
            if ! git diff --exit-code apps/docs/docs/traceability-matrix.md; then
              echo "::error::apps/docs/docs/traceability-matrix.md is stale. Run 'npm run traceability:matrix' locally and commit the result."
              exit 1
            fi
          fi
