appId: dev.pmk.desktop
productName: pmk
copyright: MIT — pm-workspace-kit contributors
electronVersion: 41.3.0
nodeGypRebuild: false

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"

extraMetadata:
  main: out/main/index.js

mac:
  category: public.app-category.developer-tools
  # Default to arm64 only — pmk devs are on Apple Silicon and shipping
  # both adds ~400 MB to the release dir. For universal binaries swap
  # `arch: [arm64, x64]` or run `--universal` on CI.
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  # Code signing is deferred — uncomment after you add an Apple Developer cert.
  # identity: "Developer ID Application: Your Name (TEAMID)"

win:
  target:
    - target: nsis
      arch: [x64]

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development

nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

publish: null
